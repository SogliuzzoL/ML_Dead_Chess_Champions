<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Client Maia-2 Professionnel</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #2c3e50;
            color: #ecf0f1;
            padding: 20px;
        }

        #settings {
            margin-bottom: 20px;
            padding: 20px;
            background: #34495e;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            width: 500px;
        }

        .row {
            margin: 15px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        input,
        select {
            padding: 8px;
            border-radius: 4px;
            border: none;
            background: #ecf0f1;
        }

        button {
            padding: 10px 20px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #2ecc71;
        }

        #board {
            width: 450px;
            border: 5px solid #34495e;
            border-radius: 4px;
        }

        #info-panel {
            margin-top: 20px;
            width: 500px;
            background: #34495e;
            padding: 15px;
            border-radius: 8px;
        }

        #status-msg {
            font-size: 1.2em;
            text-align: center;
            margin-bottom: 10px;
            font-weight: bold;
        }

        #move-probs {
            font-family: 'Courier New', Courier, monospace;
            background: #2c3e50;
            padding: 10px;
            border-radius: 4px;
            height: 120px;
            overflow-y: auto;
            font-size: 0.9em;
            color: #f1c40f;
        }
    </style>
</head>

<body>
    <h2>♟️ Confrontation Maia-2</h2>

    <div id="settings">
        <div class="row">
            <label>Position FEN :</label>
            <input type="text" id="fenInput" value="start" style="width: 300px;">
        </div>
        <div class="row">
            <label>ELO Blancs :</label> <input type="number" id="eloW" value="2500" style="width: 70px;">
            <label>ELO Noirs :</label> <input type="number" id="eloB" value="2500" style="width: 70px;">
        </div>
        <div class="row">
            <label>Votre camp :</label>
            <select id="userColor">
                <option value="w">Blancs</option>
                <option value="b">Noirs</option>
            </select>
            <button onclick="startGame()">DÉBUTER LA PARTIE</button>
        </div>
    </div>

    <div id="board"></div>

    <div id="info-panel">
        <div id="status-msg">En attente du lancement...</div>
        <div id="move-probs">Les statistiques de l'IA s'afficheront ici au fur et à mesure du jeu.</div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script>
        var board = null;
        var game = new Chess();

        function updateStatus() {
            let status = '';
            let moveColor = 'Blancs';
            if (game.turn() === 'b') moveColor = 'Noirs';

            if (game.in_checkmate()) {
                status = 'TERMINÉ : Les ' + moveColor + ' sont Échec et Mat !';
                document.getElementById('status-msg').style.color = '#e74c3c';
            } else if (game.in_draw()) {
                status = 'TERMINÉ : Match nul';
                document.getElementById('status-msg').style.color = '#95a5a6';
            } else {
                status = 'Au tour des ' + (game.turn() === 'w' ? 'Blancs' : 'Noirs');
                if (game.in_check()) {
                    status += ' (ÉCHEC)';
                    document.getElementById('status-msg').style.color = '#f39c12';
                } else {
                    document.getElementById('status-msg').style.color = '#ecf0f1';
                }
            }
            document.getElementById('status-msg').innerHTML = status;
        }

        function onDrop(source, target) {
            var move = game.move({ from: source, to: target, promotion: 'q' });
            if (move === null) return 'snapback';

            updateStatus();
            if (!game.game_over()) {
                window.setTimeout(makeAIMove, 250);
            }
        }

        async function makeAIMove() {
            if (game.game_over()) return;

            const isWhite = game.turn() === 'w';
            document.getElementById('move-probs').innerHTML = "Maia-2 réfléchit...";

            try {
                const response = await fetch('/get-move', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        fen: game.fen(),
                        active_elo: isWhite ? $('#eloW').val() : $('#eloB').val(),
                        opponent_elo: isWhite ? $('#eloB').val() : $('#eloW').val()
                    })
                });

                const data = await response.json();

                if (data.probabilities) {
                    let probsHtml = '<strong>Analyse de Maia-2 :</strong><br>';
                    const sortedProbs = Object.entries(data.probabilities).sort((a, b) => b[1] - a[1]);
                    for (const [mv, pr] of sortedProbs) {
                        probsHtml += `${mv}: ${(pr * 100).toFixed(2)}% | `;
                    }
                    document.getElementById('move-probs').innerHTML = probsHtml;
                }

                game.move(data.move, { sloppy: true });
                board.position(game.fen());
                updateStatus();
            } catch (err) {
                document.getElementById('move-probs').innerHTML = "Erreur de communication avec le serveur.";
            }
        }

        function startGame() {
            const fen = $('#fenInput').val();
            game = (fen === 'start') ? new Chess() : new Chess(fen);

            const config = {
                draggable: true,
                position: game.fen(),
                onDrop: onDrop,
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            };
            board = Chessboard('board', config);

            updateStatus();
            if ($('#userColor').val() === 'b' && game.turn() === 'w') {
                makeAIMove();
            } else if ($('#userColor').val() === 'w' && game.turn() === 'b') {
                makeAIMove();
            }
        }
    </script>
</body>

</html>
